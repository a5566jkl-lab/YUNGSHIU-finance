<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>永旭科技財務紀錄</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="永旭科技財務紀錄">
<meta name="theme-color" content="#0B5C73">
<link rel="apple-touch-icon" id="ati">
<link rel="icon" id="ico">
<link rel="manifest" id="mf">
<style>
:root{--bg:#EAF1F4;--card:#fff;--ink:#10272F;--mute:#5E7580;--line:#D3E0E6;--pri:#0B5C73;--warn:#D9731A;--bad:#C0392B;--good:#1B7F5C}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;padding:0 0 env(safe-area-inset-bottom)}
header{background:var(--pri);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px}
header h1{margin:0 0 10px;font-size:20px;letter-spacing:.06em}
.bar{display:flex;gap:8px;justify-content:space-between}
.pj{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;font:inherit;color:inherit}
.pj b{grid-column:1/-1;font-size:17px;margin-bottom:2px}
.pj span{font-size:14px;color:var(--mute)}
.pj span:last-child{text-align:right;font-weight:600}
.pj span.pos{color:var(--good)}.pj span.neg{color:var(--bad)}
select,input{font:inherit;color:inherit}
select{flex:1;min-width:0;padding:9px;border-radius:8px;border:0}
.btn{border:0;border-radius:8px;padding:9px 14px;font:inherit;background:#fff;color:var(--pri);font-weight:600}
.btn.d{background:transparent;color:#fff;border:1px solid #ffffff88}
main{padding:12px;max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
h2{margin:0 0 10px;font-size:16px}
label.f{display:block;font-size:13px;color:var(--mute);margin-bottom:10px}
input[type=text],input[type=number]{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;margin-top:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{border-top:1px solid var(--line);padding:10px 0}
.r1{display:grid;grid-template-columns:30px 1fr 112px 36px;gap:8px}
.mv{display:flex;flex-direction:column;gap:2px}
.mv button{flex:1;border:0;background:#DCEAF0;color:var(--pri);border-radius:6px;font-size:11px;padding:0}
.mv button:disabled{opacity:.3}
.r2{display:flex;gap:8px;margin-top:8px;align-items:center}
.r2 input[type=text]{flex:1;margin:0}
.r2 label{font-size:13px;color:var(--mute);white-space:nowrap}
.r1 input{margin:0}
.x{border:0;background:#F6E4E1;color:var(--bad);border-radius:8px;font-size:16px}
.add{width:100%;margin-top:8px;background:var(--pri);color:#fff;padding:11px}
.s{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
.s span:last-child{font-variant-numeric:tabular-nums}
.s.sub span:first-child{color:var(--mute);font-size:14px;padding-left:10px}
.profit{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px}
.profit b{font-size:30px;font-variant-numeric:tabular-nums}
.pos{color:var(--good)}.neg{color:var(--bad)}
.pie{display:block;margin:4px auto 12px}
.lg{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px}
.lg i{width:12px;height:12px;border-radius:3px;flex:none}
.lg em{margin-left:auto;font-style:normal;font-variant-numeric:tabular-nums;color:var(--mute)}
.note{font-size:12px;color:var(--mute);margin-top:8px}
.empty{text-align:center;padding:40px 16px;color:var(--mute)}
.empty .btn{background:var(--pri);color:#fff;margin-top:12px}
.foot{display:flex;gap:8px}.foot .btn{flex:1;background:#fff;border:1px solid var(--line);color:var(--mute);font-weight:400}
#login{position:fixed;inset:0;background:var(--bg);z-index:9;display:flex;align-items:center;justify-content:center;padding:20px}
#login[hidden]{display:none}
.lc{background:#fff;border-radius:12px;padding:20px;width:100%;max-width:360px;border:1px solid var(--line)}
.lc input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;margin:6px 0;font:inherit}
#err{color:var(--bad);font-size:13px;min-height:18px}
.sub{font-size:12px;opacity:.85;margin:-6px 0 8px;min-height:16px}
</style>
</head>
<body>
<div id="login" hidden><div class="lc"><h2>登入永旭科技財務紀錄</h2>
<input type="text" id="em" placeholder="電子信箱" autocomplete="username" inputmode="email">
<input type="password" id="pw" placeholder="密碼（至少 6 碼）" autocomplete="current-password">
<div id="err"></div>
<button class="btn add" onclick="lg(false)">登入</button>
<button class="btn" style="width:100%;margin-top:8px;border:1px solid var(--line)" onclick="lg(true)">第一次使用：註冊</button></div></div>
<header>
  <h1>永旭科技財務紀錄</h1>
  <div class="sub" id="st"></div>
  <div class="bar">
    <button class="btn d" id="back" onclick="go(null)" hidden>‹ 所有工程</button>
    <button class="btn" id="addb" onclick="addP()">＋新增工程</button>
  </div>
</header>
<main>
  <div id="list" hidden></div>
  <div id="empty" class="empty" hidden>還沒有任何工程<br><button class="btn" onclick="addP()">＋新增第一個工程</button></div>
  <div id="main" hidden>
    <div class="card">
      <label class="f">工程名稱（可修改）<input type="text" id="pn" oninput="P().name=this.value;save()"></label>
      <h2>工程款總額（收入）</h2>
      <div class="two">
        <label class="f">未稅金額<input type="text" inputmode="numeric" id="iEx" oninput="cm(this);exc(this.value)"></label>
        <label class="f">含稅金額<input type="text" inputmode="numeric" id="iInc" oninput="cm(this);incc(this.value)"></label>
      </div>
      <div class="note">兩欄擇一輸入，另一欄自動換算（含稅＝未稅×1.05，四捨五入至個位）。</div>
    </div>

    <div class="card">
      <h2>支出項目</h2>
      <div id="rows"></div>
      <button class="btn add" onclick="addI()">＋新增支出項目</button>
      <div class="note">支出金額請填「實際付出的金額」。若該筆有取得統一發票（含稅），勾選「含進項發票」，系統會把其中 5% 進項稅額用來抵減營業稅。</div>
    </div>

    <div class="card">
      <h2>損益結算</h2>
      <div id="sum"></div>
      <div class="note">營利事業所得稅 ＝ 未稅工程款 × 7% × 20%，系統自動計算並計入成本。</div>
    </div>

    <div class="card">
      <h2>成本比例</h2>
      <canvas id="pie" class="pie"></canvas>
      <div id="lg"></div>
    </div>

    <button class="btn" style="width:100%;background:#fff;border:1px solid var(--line);color:var(--bad);font-weight:400;margin-bottom:12px" onclick="delP()">刪除此工程</button>
  </div>
  <div class="foot">
    <button class="btn" onclick="bak()">複製備份資料</button>
    <button class="btn" onclick="res()">貼上還原資料</button>
    <button class="btn" onclick="out()">登出</button>
  </div>
  <div class="note" style="text-align:center;margin:10px 0 24px">已登入：<span id="who"></span>　資料會自動同步到雲端</div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const $=s=>document.querySelector(s),R=Math.round;
const f=n=>(n<0?'-':'')+Math.abs(R(n)).toLocaleString('en-US');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
/* ====== 雲端同步設定：把 Firebase 給你的 const firebaseConfig = {...}; 整段貼來取代下面這一行 ====== */
const firebaseConfig = {
  apiKey: "AIzaSyDr-Yqs9ZSVBFhEdQVgOpmGN9SDAv1uhow",
  authDomain: "yungshiu-finance.firebaseapp.com",
  projectId: "yungshiu-finance",
  storageBucket: "yungshiu-finance.firebasestorage.app",
  messagingSenderId: "523041874551",
  appId: "1:523041874551:web:ec4a5875de21fad2771c72"
};
/* ====== 設定結束 ====== */
const COL=['#0B5C73','#D9731A','#3FA796','#8E5BA8','#E0B33A','#4F7CC1','#C0506B','#7A8F2B','#6B7B85','#2E9CCB'];
let S;try{S=JSON.parse(localStorage.getItem('yx_fin'))}catch(e){}
if(!S||!S.ps)S={ps:[],cur:null,rate:0};
let last='',U=null,db=null,tm=null,ready=false;
const st=t=>{$('#st').textContent=t};
const sh=()=>JSON.stringify({ps:S.ps,rate:S.rate});
const loc=()=>{try{localStorage.setItem('yx_fin',JSON.stringify(S))}catch(e){}};
const save=()=>{if(U&&ready&&sh()!==last){S.ts=Date.now();push()}loc()};
function push(){
  clearTimeout(tm);st('同步中…');
  tm=setTimeout(async()=>{
    try{const d=sh();await db.doc('users/'+U.uid).set({data:d,ts:S.ts});last=d;loc();st('已同步')}
    catch(e){st('同步失敗，稍後會重試')}
  },700);
}
async function pull(first){
  try{
    const r=await db.doc('users/'+U.uid).get(),has=S.ps.length>0;
    if(!r.exists){if(has){S.ts=Date.now();last='';push()}else{last=sh();st('已同步')}}
    else{
      const v=r.data();
      if(v.ts>(S.ts||0)){
        if(first&&has&&!S.ts&&!confirm('雲端已有資料。\n按「確定」＝使用雲端資料\n按「取消」＝用這台裝置的資料覆蓋雲端')){S.ts=Date.now();last='';push()}
        else{const o=JSON.parse(v.data);S.ps=o.ps;S.rate=o.rate;S.ts=v.ts;last=v.data;if(!P())S.cur=null;loc();draw();st('已同步')}
      }else if(v.ts<(S.ts||0)){last='';push()}
      else{last=v.data;st('已同步')}
    }
  }catch(e){st('離線中，使用本機資料')}
  ready=true;
}
const MSG={'auth/invalid-credential':'帳號或密碼錯誤','auth/wrong-password':'帳號或密碼錯誤','auth/user-not-found':'帳號或密碼錯誤','auth/email-already-in-use':'此信箱已註冊，請改按「登入」','auth/weak-password':'密碼至少 6 碼','auth/invalid-email':'信箱格式不正確','auth/admin-restricted-operation':'目前已關閉註冊','auth/network-request-failed':'網路連線失敗'};
function lg(reg){
  $('#err').textContent='';
  const a=firebase.auth(),e=$('#em').value.trim(),p=$('#pw').value;
  (reg?a.createUserWithEmailAndPassword(e,p):a.signInWithEmailAndPassword(e,p)).catch(x=>{$('#err').textContent=MSG[x.code]||'操作失敗，請稍後再試'});
}
function out(){
  if(!confirm('登出後，這台裝置的本機資料會清除（雲端資料不會刪除）。確定登出？'))return;
  ready=false;try{localStorage.removeItem('yx_fin')}catch(e){}
  S={ps:[],cur:null,rate:0};firebase.auth().signOut();draw();
}
function init(){
  if(firebaseConfig.apiKey.indexOf('貼')===0){st('尚未設定雲端同步（資料只存在本機）');return}
  firebase.initializeApp(firebaseConfig);db=firebase.firestore();
  firebase.auth().onAuthStateChanged(u=>{
    U=u;$('#login').hidden=!!u;
    if(u){$('#who').textContent=u.email;pull(true)}else st('');
  });
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&U)pull(false)});
}
const P=()=>S.ps.find(p=>p.id==S.cur);

/* icon + manifest（App 名稱與圖示） */
(function(){
  const c=document.createElement('canvas');c.width=c.height=180;const g=c.getContext('2d');
  g.fillStyle='#0B5C73';g.fillRect(0,0,180,180);
  g.fillStyle='#fff';g.fillRect(20,128,140,6);
  g.font='bold 74px "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif';
  g.textAlign='center';g.textBaseline='middle';g.fillText('永旭',90,74);
  const u=c.toDataURL('image/png');
  $('#ati').href=u;$('#ico').href=u;
  try{
    const m={name:'永旭科技財務紀錄',short_name:'永旭科技財務紀錄',display:'standalone',start_url:location.href.split('#')[0],background_color:'#EAF1F4',theme_color:'#0B5C73',icons:[{src:u,sizes:'180x180',type:'image/png'}]};
    $('#mf').href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));
  }catch(e){}
})();

function addP(){
  const n=prompt('工程名稱','新工程');if(n===null)return;
  const p={id:uid(),name:n||'新工程',ex:0,inc:0,items:[]};
  S.ps.push(p);S.cur=p.id;save();draw();scrollTo(0,0);
}
function delP(){
  const p=P();if(!p||!confirm('確定刪除「'+p.name+'」？此動作無法復原'))return;
  S.ps=S.ps.filter(x=>x.id!=p.id);S.cur=null;save();draw();
}
function go(id){S.cur=id;save();draw();scrollTo(0,0)}
const num=v=>+String(v).replace(/\D/g,'')||0;
const fv=n=>n?Math.round(n).toLocaleString('en-US'):'';
function cm(el){
  const c=el.selectionStart,n=el.value.slice(0,c).replace(/\D/g,'').length;
  el.value=fv(num(el.value));
  let k=0,pos=0;
  if(n>0){for(pos=0;pos<el.value.length;pos++){if(/\d/.test(el.value[pos]))k++;if(k==n){pos++;break}}}
  try{el.setSelectionRange(pos,pos)}catch(e){}
}
function mv(id,d){
  const a=P().items,i=a.findIndex(x=>x.id==id),j=i+d;
  if(j<0||j>=a.length)return;
  [a[i],a[j]]=[a[j],a[i]];save();draw();
}
function stat(p){let exp=0,inp=0;p.items.forEach(i=>{const a=R(i.amt||0);exp+=a;if(i.inv)inp+=a-R(a/1.05)});
  const vat=p.inc-p.ex-inp,pre=p.ex-(exp-inp),it=R(p.ex*0.07*0.2);return{profit:p.inc-exp-vat-it}}
function incc(v){const p=P();p.inc=num(v);p.ex=R(p.inc/1.05);$('#iEx').value=fv(p.ex);save();calc()}
function exc(v){const p=P();p.ex=num(v);p.inc=R(p.ex*1.05);$('#iInc').value=fv(p.inc);save();calc()}
function addI(){P().items.push({id:uid(),name:'',amt:0,note:'',inv:false});save();draw()}
function delI(id){const p=P();p.items=p.items.filter(i=>i.id!=id);save();draw()}
function setI(id,k,v){P().items.find(i=>i.id==id)[k]=v;save();calc()}

function draw(){
  const p=P();
  $('#back').hidden=!p;$('#addb').hidden=!!p;$('#main').hidden=!p;
  $('#list').hidden=!!p||!S.ps.length;$('#empty').hidden=!!p||!!S.ps.length;
  if(!p){
    $('#list').innerHTML=S.ps.map(x=>{const t=stat(x);return `<button class="pj" onclick="go('${x.id}')"><b>${esc(x.name||'未命名')}</b><span>含稅 ${f(x.inc)}</span><span class="${t.profit>=0?'pos':'neg'}">利潤 ${f(t.profit)}</span></button>`}).join('');
    return}
  $('#pn').value=p.name;$('#iEx').value=fv(p.ex);$('#iInc').value=fv(p.inc);
  $('#rows').innerHTML=p.items.map((i,k)=>`<div class="row">
    <div class="r1"><div class="mv"><button ${k?'':'disabled'} onclick="mv('${i.id}',-1)">▲</button><button ${k<p.items.length-1?'':'disabled'} onclick="mv('${i.id}',1)">▼</button></div><input type="text" placeholder="項目名稱" value="${esc(i.name)}" oninput="setI('${i.id}','name',this.value)">
    <input type="text" inputmode="numeric" placeholder="金額" value="${fv(i.amt)}" oninput="cm(this);setI('${i.id}','amt',num(this.value))">
    <button class="x" onclick="delI('${i.id}')">✕</button></div>
    <div class="r2"><input type="text" placeholder="備註" value="${esc(i.note)}" oninput="setI('${i.id}','note',this.value)">
    <label><input type="checkbox" ${i.inv?'checked':''} onchange="setI('${i.id}','inv',this.checked)"> 含進項發票</label></div></div>`).join('');
  calc();
}

function calc(){
  const p=P();if(!p)return;
  let exp=0,inp=0,expEx=0;
  p.items.forEach(i=>{const a=R(i.amt||0);exp+=a;const t=i.inv?a-R(a/1.05):0;inp+=t;expEx+=a-t});
  const out=p.inc-p.ex,vat=out-inp,pre=p.ex-expEx;
  const it=R(p.ex*0.07*0.2),profit=p.inc-exp-vat-it;
  const margin=p.inc?(profit/p.inc*100).toFixed(1):'0.0';
  $('#sum').innerHTML=`
   <div class="s"><span>工程款（含稅）</span><span>${f(p.inc)}</span></div>
   <div class="s"><span>支出合計</span><span>− ${f(exp)}</span></div>
   <div class="s sub"><span>開立發票銷項稅額（5%）</span><span>${f(out)}</span></div>
   <div class="s sub"><span>進項稅額（可扣抵）</span><span>− ${f(inp)}</span></div>
   <div class="s"><span>${vat>=0?'年底應繳營業稅':'可退營業稅'}</span><span>− ${f(vat)}</span></div>
   ${it?`<div class="s"><span>營利事業所得稅（未稅×7%×20%）</span><span>− ${f(it)}</span></div>`:''}
   <div class="profit"><span>利潤（${margin}%）</span><b class="${profit>=0?'pos':'neg'}">${f(profit)}</b></div>`;
  const sl=p.items.filter(i=>i.amt>0).map(i=>[i.name||'未命名',R(i.amt)]);
  if(vat>0)sl.push(['營業稅',vat]);
  if(it>0)sl.push(['營利事業所得稅',it]);
  pie(sl);
}

function pie(sl){
  const c=$('#pie'),d=window.devicePixelRatio||1,W=230;
  c.width=W*d;c.height=W*d;c.style.width=c.style.height=W+'px';
  const g=c.getContext('2d');g.scale(d,d);g.clearRect(0,0,W,W);
  const tot=sl.reduce((s,x)=>s+x[1],0);
  if(!tot){c.style.display='none';$('#lg').innerHTML='<div class="note" style="text-align:center">輸入支出後會顯示比例圖</div>';return}
  c.style.display='block';
  let a=-Math.PI/2;
  sl.forEach((x,k)=>{
    const e=a+x[1]/tot*2*Math.PI;
    g.beginPath();g.moveTo(W/2,W/2);g.arc(W/2,W/2,W/2-2,a,e);g.closePath();
    g.fillStyle=COL[k%COL.length];g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.stroke();a=e;
  });
  $('#lg').innerHTML=sl.map((x,k)=>`<div class="lg"><i style="background:${COL[k%COL.length]}"></i><span>${esc(x[0])}</span><em>${f(x[1])}　${(x[1]/tot*100).toFixed(1)}%</em></div>`).join('');
}

function bak(){
  const t=JSON.stringify(S);
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert('已複製備份，可貼到備忘錄保存')).catch(()=>prompt('請全選複製：',t));
}
function res(){
  const t=prompt('貼上備份內容');if(!t)return;
  try{const o=JSON.parse(t);if(!o.ps)throw 0;S=o;save();draw();alert('已還原')}catch(e){alert('備份格式不正確')}
}
S.cur=null;
draw();init();
</script>
</body>
</html>
